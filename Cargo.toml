[package]
name = "fluxer-tui"
version = "0.7.5"
edition = "2024"
description = "A keyboard-only TUI chat client for the Fluxer messaging platform, with inline media, notifications and Linux console support."
license = "GPL-3.0-or-later"
repository = "https://github.com/AIVirtuoso/fluxter"
homepage = "https://github.com/AIVirtuoso/fluxter"
readme = "README.md"

[[bin]]
name = "fluxter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
emojis = "0.8.0"
futures-util = "0.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "8.1", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
unicode-width = "0.2"
urlencoding = "2"
chrono = "0.4"
tempfile = "3"
ansi-to-tui = "7"
# console mode: draw the whole UI ourselves through DRM on a Linux VT
drm = "0.15"
swash = "0.2"
libc = "0.2"

[lints.rust]
non_snake_case = "allow"
